<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MentorFlow - Bilimingizni boshqarish endi yanada oson. Ta'lim boshqaruv tizimiga kiring." />
    <meta name="keywords" content="MentorFlow, LMS, ta'lim, o'qituvchi, o'quvchi" />
    <meta property="og:title" content="MentorFlow - Tizimga kirish" />
    <meta property="og:description" content="MentorFlow orqali vazifalarni boshqaring, o'quvchilarni kuzating va ota-onalar bilan doimo aloqada bo'ling." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>MentorFlow — Tizimga kirish</title>
    <script>
      // Anti-flash: apply dark class before first paint
      (function() {
        var t = localStorage.getItem('mentorflow-theme') || 'system';
        var d = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (d) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
